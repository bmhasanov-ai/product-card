<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="catalog catalog__container">
    <div class="buttons-container">
      <button class="buttons" id="change-card-color-button">Сменить цвет карточки</button>
      <button class="buttons" id="change-cards-color-button">Сменить цвет всех карточек</button>
      <button class="buttons" id="google-button">Открыть гугл</button>
      <button class="buttons" id="open-console-button">Console log</button>
      <button class="buttons sea" id="colorful-button">Разноцветная кнопка</button>
    </div>
    <h1 class="title catalog__title">Выбери свой продукт</h1>
    <div id="product-list" class="container ">
    </div>
    <template id="product-template">
      <div class="product">
        <img class="product__image" src="" alt="" width="295" height="245">
        <p class="product__description"></p>
        <h2 class="product__name"></h2>
        <p class="product__properties"></p>
        <div class="compound">
          <p class="compound__item">Состав:</p>
          <ul class="compound__list"></ul>
        </div>
        <div class="price">
          <b class="price__title">Цена</b>
          <span class="price__value"></span>
        </div>
      </div>
    </template>
  </main>
  <script src="main.js"></script>
  <script src="homework-7.js"></script>
  <script src="homework-8.js"></script>
  <script src="homework-9.js" type="module"></script>
  <script src="homework-10.js" type="module"></script>
</body>

</html>
